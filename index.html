<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>商品記錄</title>
  <style>
    :root {
      --bg: #f2f4f1;
      --ink: #1f2a25;
      --sub: #5b6a63;
      --line: #cfd6d1;
      --card: #fff;
      --accent: #7a4b22;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171c19;
        --ink: #e8ede9;
        --sub: #9aa8a1;
        --line: #2f3a34;
        --card: #1f2622;
        --accent: #d9a066;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      line-height: 1.7;
    }
    h1 { font-size: 1.6rem; margin: 0 0 1rem; }
    .app {
      max-width: 44rem;
      margin: 0 auto;
      padding: 3rem 1.25rem;
    }
    .item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .item h2 { font-size: 1.2rem; margin: 0 0 .5rem; }
    .item dl {
      margin: 0;
      display: grid;
      grid-template-columns: 4rem 1fr;
      gap: .25rem .75rem;
    }
    .item dt { color: var(--sub); }
    .item dd {
      margin: 0;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .note { color: var(--sub); font-size: .9rem; }
  </style>
</head>
<body>
  <main class="app">
    <h1>商品記錄</h1>
    <p class="note">目前已移除聊天助手功能，只保留基本商品資訊展示。</p>

    <article class="item">
      <h2>示範商品 A（假資料）</h2>
      <dl>
        <dt>價格</dt><dd>NT$ 100（假）</dd>
        <dt>說明</dt><dd>這是示範用的說明文字，用來看版面。</dd>
        <dt>成分</dt><dd>示範成分一、示範成分二</dd>
      </dl>
    </article>

    <article class="item">
      <h2>示範商品 B（假資料）</h2>
      <dl>
        <dt>價格</dt><dd>NT$ 200（假）</dd>
        <dt>說明</dt><dd>說明可以寫比較長的內容，
也可以換行。</dd>
        <dt>成分</dt><dd>示範成分三、示範成分四</dd>
      </dl>
    </article>
  </main>
</body>
</html>
