<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>商品記錄</title>
<style>:root{--bg:#f2f4f1;--ink:#1f2a25;--sub:#5b6a63;--line:#cfd6d1;--card:#fff;--accent:#7a4b22}
@media (prefers-color-scheme:dark){:root{--bg:#171c19;--ink:#e8ede9;--sub:#9aa8a1;--line:#2f3a34;--card:#1f2622;--accent:#d9a066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7}
h1{font-size:1.6rem;margin:0 0 1rem}
.gate,.app{max-width:44rem;margin:0 auto;padding:3rem 1.25rem}
.row{display:flex;gap:.5rem;margin-top:.5rem}
input{flex:1;font:inherit;padding:.6rem .75rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{font:inherit;padding:.6rem 1.1rem;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{color:#b3261e;min-height:1.5rem}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem 1.25rem;margin-bottom:1rem}
.item h2{font-size:1.2rem;margin:0 0 .5rem}
.item dl{margin:0;display:grid;grid-template-columns:4rem 1fr;gap:.25rem .75rem}
.item dt{color:var(--sub)}
.item dd{margin:0;white-space:pre-line}
.tbc{color:var(--sub)}
.sr{position:absolute;left:-9999px}

.demo{background:var(--accent);color:#fff;text-align:center;padding:.5rem 1rem;font-size:.95rem}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1rem;align-items:center}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.chip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.grow{flex:1}
a{color:var(--accent)}
.item a.t{text-decoration:none;color:inherit;display:block}
.item a.t:hover h2{text-decoration:underline}
.cat{color:var(--sub);font-size:.9rem;margin:0 0 .5rem}
form{display:grid;gap:.75rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem 1.25rem}
form label{display:grid;gap:.25rem;color:var(--sub)}
textarea,select{font:inherit;padding:.6rem .75rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.note{color:var(--sub);font-size:.9rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:1rem;overflow:auto;z-index:10}
.box{background:var(--card);border-radius:12px;padding:1.25rem;width:min(30rem,100%);max-height:90vh;overflow:auto;display:grid;gap:.75rem}
.box h2{margin:0}.box form{border:0;padding:0}
.badge{display:inline-block;margin-left:.5rem;padding:0 .55rem;border-radius:999px;background:#f3d9a4;color:#5a3b00;font-size:.8rem;line-height:1.5;vertical-align:baseline;white-space:nowrap}
dd>.badge:first-child{margin-left:0}
.st{display:inline-block;margin-left:.5rem;padding:0 .55rem;border-radius:999px;font-size:.8rem;line-height:1.5;white-space:nowrap;border:1px solid transparent}
.st.ok{background:#d6ecd9;color:#1d4a26}.st.off{background:#e6e0e0;color:#5a2a2a;border-color:#cdbcbc}.st.sea{background:#d4e4f5;color:#173d63}.st.oth,.st.unk{background:transparent;color:var(--sub);border-color:var(--line)}
@media (prefers-color-scheme:dark){.st.ok{background:#24432b;color:#cfe9d3}.st.off{background:#3a2e2e;color:#e6cfcf;border-color:#5a4444}.st.sea{background:#233a54;color:#cfe1f5}}
.chk{display:flex;flex-direction:row;align-items:center;gap:.5rem;font-size:.9rem;margin-top:.25rem}
.chk input{flex:none}
.fld{display:grid}
@media (prefers-color-scheme:dark){.badge{background:#5a4620;color:#f5deb0}}
.item.withsel{display:flex;gap:.75rem;align-items:flex-start}
.item.withsel .grow{min-width:0}
.sel{display:block}.sel input{flex:none;width:1.2rem;height:1.2rem;padding:0;margin-top:.35rem}
.bar input[type=search]{min-width:10rem}
button:disabled{opacity:.5;cursor:not-allowed}
.warn{background:#f3d9a4;color:#3d2800;border-radius:8px;padding:.6rem .8rem;font-size:.9rem;display:grid;gap:.25rem}
.warn[hidden]{display:none}.warn ul{margin:0;padding-left:1.2rem}
.log{margin-top:1rem}.log h3{margin:0 0 .5rem;font-size:1.05rem}
.logitem{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.6rem .9rem;margin-bottom:.5rem}
.logitem ul{margin:.25rem 0 0;padding-left:1.2rem;white-space:pre-line;overflow-wrap:anywhere}
@media (prefers-color-scheme:dark){.warn{background:#5a4620;color:#f5deb0}}
</style></head><body>
<main class="gate" id="gate"><h1>商品記錄</h1><p>請輸入密碼後查看。</p>
<div class="row"><label for="pw" class="sr">密碼</label><input id="pw" type="password" autocomplete="current-password"><button id="unlock" type="button">解鎖</button></div>
<p id="gate-msg" class="msg" role="alert"></p></main>
<main class="app" id="root" hidden></main>
<script>
// ===== 商品與分類資料（目前都是假資料，請替換成真實內容）=====
const TBC="待確認", KEY="bakery-products";
// 供應狀態選項：要新增狀態，直接在這個清單加文字即可（顏色另見 stClass）
const STATUSES=["正常供應","暫停供應","季節限定"];
const CATS=["麵包（示範）","蛋糕（示範）","餅乾（示範）"];
const SEED=[
 {id:"s1",name:"示範商品 A（假資料）",cat:CATS[0],price:"NT$ 100（假）",description:"這是示範用的說明文字，用來看版面。",ingredients:"示範成分一、示範成分二（假資料）",status:"正常供應"},
 {id:"s2",name:"示範商品 B（假資料）",cat:CATS[1],price:"NT$ 200（假）",description:"說明可以寫比較長的內容，\n也可以換行。",ingredients:"示範成分三、示範成分四（假資料）",pending:{ingredients:true},status:"季節限定"},
 {id:"s3",name:"示範商品 C（假資料）",cat:CATS[2],price:"",description:"",ingredients:"",status:"暫停供應"}
];
let mem=[], storageOK=true;
function loadAdded(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){storageOK=false;return mem}}
function saveAdded(a){mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){storageOK=false}}
let memEdits={};
function loadEdits(){try{return JSON.parse(localStorage.getItem(KEY+"-edits")||"{}")}catch(e){return memEdits}}
function updateProduct(id,data){
  if(id.startsWith("u")){const a=loadAdded();const i=a.findIndex(x=>x.id===id);if(i>=0){a[i]=Object.assign({},a[i],data);saveAdded(a)}}
  else{const e=loadEdits();e[id]=Object.assign({},e[id]||{},data);memEdits=e;try{localStorage.setItem(KEY+"-edits",JSON.stringify(e))}catch(x){}}
}
const all=()=>{const e=loadEdits();return SEED.map(p=>Object.assign({},p,e[p.id]||{})).concat(loadAdded())};
const f=v=>(typeof v==="string"&&v.trim())?v.trim():TBC;

// ===== 修改紀錄（存在瀏覽器，key 為 KEY+"-log"）=====
let memLog=[];
function loadLog(){try{return JSON.parse(localStorage.getItem(KEY+"-log")||"[]")}catch(e){return memLog}}
function addLog(pid,name,changes,batch){const a=loadLog();a.push({pid:pid,name:name,t:Date.now(),batch:!!batch,changes:changes});memLog=a;try{localStorage.setItem(KEY+"-log",JSON.stringify(a))}catch(e){}}
const LABELS={name:"商品名稱",cat:"分類",status:"供應狀態",price:"價格",description:"說明",ingredients:"成分"};
const dispVal=(k,v)=>k==="cat"?(v||"未分類"):k==="status"?(STATUSES.includes(v)?v:"待確認"):(hasVal(v)?String(v).trim():"（空白）");
function diffProduct(a,b){const ch=[];
  ["name","cat","status","price","description","ingredients"].forEach(k=>{
    const x=k==="status"?(STATUSES.includes(a[k])?a[k]:""):(hasVal(a[k])?String(a[k]).trim():"");
    const y=k==="status"?(STATUSES.includes(b[k])?b[k]:""):(hasVal(b[k])?String(b[k]).trim():"");
    if(x!==y)ch.push({f:LABELS[k],from:dispVal(k,a[k]),to:dispVal(k,b[k])})});
  PFIELDS.forEach(k=>{const x=isPending(a,k),y=isPending(b,k);if(x!==y)ch.push({f:LABELS[k]+"確認狀態",from:x?"待確認":"已確認",to:y?"待確認":"已確認"})});
  return ch}
const fmtTime=t=>new Date(t).toLocaleString("zh-TW",{hour12:false});
function logView(pid){const logs=loadLog().filter(x=>x.pid===pid).sort((a,b)=>b.t-a.t);
  const wrap=el("section",{className:"log"},el("h3",{textContent:"修改紀錄"}));
  if(!logs.length){wrap.append(el("p",{className:"note",textContent:"尚無修改紀錄。"}));return wrap}
  logs.forEach(l=>{const ul=el("ul",{});l.changes.forEach(c=>ul.append(el("li",{textContent:c.f+"：「"+c.from+"」→「"+c.to+"」"})));
    wrap.append(el("div",{className:"logitem"},el("div",{className:"cat",textContent:fmtTime(l.t)+(l.batch?"（批次修改）":"")}),ul))});
  return wrap}

// ===== 相同／相似品名檢查 =====
const normName=s=>String(s||"").toLowerCase().replace(/[\s\u3000()（）\[\]【】「」『』,，.。、:：;；!！?？\-_~～'"“”‘’]/g,"");
function bigrams(s){const r=new Set();for(let i=0;i<s.length-1;i++)r.add(s.slice(i,i+2));return r}
function findSimilar(raw){const a=normName(raw);if(!a)return [];const out=[];
  for(const p of all()){const b=normName(p.name);if(!b)continue;let kind=null;
    if(a===b)kind="相同";
    else{const sh=a.length<=b.length?a:b,lo=a.length<=b.length?b:a;
      if(sh.length>=2&&lo.includes(sh))kind="相似";
      else if(a.length>=2&&b.length>=2){const A=bigrams(a),B=bigrams(b);let n=0;A.forEach(x=>{if(B.has(x))n++});if(2*n/(A.size+B.size)>=0.5)kind="相似"}}
    if(kind)out.push({p:p,kind:kind})}
  return out}

// ===== 匯出 CSV =====
const anyPending=p=>PFIELDS.some(k=>isPending(p,k));
function buildCsv(items){const H=["商品名稱","分類","供應狀態","價格","說明","成分","價格確認狀態","說明確認狀態","成分確認狀態"];
  const cell=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const t=v=>hasVal(v)?String(v).trim():"";
  const rows=items.map(p=>[t(p.name),p.cat||"未分類",STATUSES.includes(p.status)?p.status:"待確認",t(p.price),t(p.description),t(p.ingredients)].concat(PFIELDS.map(k=>isPending(p,k)?"待確認":"已確認")));
  return [H].concat(rows).map(r=>r.map(cell).join(",")).join("\r\n")}

let filter="全部",q="",fStatus="",fConf="";const selected=new Set();let view={n:"list"};
function go(n,id){view={n:n,id:id};render();window.scrollTo(0,0)}
function lnk(t,fn,cls,...kids){const a=el("a",{href:"#",textContent:t,className:cls||""},...kids);a.onclick=e=>{e.preventDefault();fn()};return a}
const root=document.getElementById("root");
function el(tag,props,...kids){const e=document.createElement(tag);Object.assign(e,props||{});e.append(...kids);return e}
const hasVal=v=>typeof v==="string"&&v.trim()!=="";
const PFIELDS=["price","description","ingredients"];
// 待確認規則：欄位沒填 = 一定是待確認；有填但商家勾選「待確認」= 待確認；其他 = 已確認（舊資料沒有 pending 欄位也適用）
const isPending=(p,k)=>!hasVal(p[k])||!!(p.pending&&p.pending[k]);
const badge=t=>el("span",{className:"badge",textContent:t||TBC});
function row(dl,l,p,k){const dd=el("dd",{});
  if(!hasVal(p[k]))dd.append(badge());else{dd.append(document.createTextNode(p[k].trim()));if(isPending(p,k))dd.append(badge())}
  dl.append(el("dt",{textContent:l}),dd)}
const stClass={"正常供應":"ok","暫停供應":"off","季節限定":"sea"};
function stBadge(p){const known=STATUSES.includes(p.status);return el("span",{className:"st "+(known?(stClass[p.status]||"oth"):"unk"),textContent:known?p.status:"供應狀態待確認"})}
function catLine(p){const n=PFIELDS.filter(k=>isPending(p,k)).length;const e=el("p",{className:"cat",textContent:p.cat||"未分類"});e.append(stBadge(p));if(n)e.append(badge(n+" 項待確認"));return e}

function listView(){
  const chips=[],opt=(v,t)=>el("option",{value:v,textContent:t});
  const bar=el("div",{className:"bar"});
  ["全部",...CATS].forEach(c=>{const b=el("button",{type:"button",className:"chip",textContent:c});b.onclick=()=>{filter=c;refresh()};chips.push([c,b]);bar.append(b)});
  bar.append(el("span",{className:"grow"}),lnk("＋ 新增商品",openModal));
  const search=el("input",{type:"search",id:"q",placeholder:"搜尋品名",value:q});search.setAttribute("aria-label","搜尋品名");
  const fs=el("select",{id:"fs"},opt("","全部供應狀態"),...STATUSES.map(x=>opt(x,x)),opt("__unset","供應狀態待確認"));fs.setAttribute("aria-label","供應狀態篩選");fs.value=fStatus;
  const fc=el("select",{id:"fc"},opt("","全部資料狀態"),opt("pending","有待確認項目"),opt("confirmed","資料皆已確認"));fc.setAttribute("aria-label","資料確認狀態篩選");fc.value=fConf;
  const clear=el("button",{type:"button",className:"chip",id:"clear",textContent:"清除條件"});
  const filt=el("div",{className:"bar"},search,fs,fc,clear);
  const allCb=el("input",{type:"checkbox",id:"selall"}),count=el("span",{className:"note",id:"count"});
  const bst=el("select",{id:"bst"},...STATUSES.map(x=>opt(x,x)));bst.setAttribute("aria-label","批次設定的供應狀態");
  const apply=el("button",{type:"button",className:"chip",id:"apply"}),exp=el("button",{type:"button",className:"chip",id:"export",textContent:"匯出所選"});
  const batch=el("div",{className:"bar"},el("label",{className:"chk"},allCb,el("span",{textContent:"全選目前結果"})),count,el("span",{className:"grow"}),bst,apply,exp);
  const bmsg=el("p",{className:"note",role:"status",id:"bmsg"}),list=el("div",{className:"list"});
  let visible=[];
  const matches=p=>{const nq=normName(q);
    return (filter==="全部"||p.cat===filter)
      &&(!nq||normName(p.name).includes(nq))
      &&(fStatus===""||(fStatus==="__unset"?!STATUSES.includes(p.status):p.status===fStatus))
      &&(fConf===""||(fConf==="pending"?anyPending(p):!anyPending(p)))};
  function updateBar(){const n=selected.size;
    count.textContent="顯示 "+visible.length+" / 共 "+all().length+" 項｜已選 "+n+" 項";
    apply.textContent="套用到已選 "+n+" 項";apply.disabled=exp.disabled=(n===0);
    allCb.checked=visible.length>0&&n===visible.length;allCb.indeterminate=n>0&&n<visible.length}
  function refresh(){
    chips.forEach(([c,b])=>b.setAttribute("aria-pressed",String(c===filter)));
    bmsg.textContent="";
    visible=all().filter(matches);
    const ids=new Set(visible.map(p=>p.id));[...selected].forEach(id=>{if(!ids.has(id))selected.delete(id)});
    list.replaceChildren();
    if(!visible.length)list.textContent=all().length?"沒有符合條件的商品。":"目前沒有商品。";
    visible.forEach(p=>{const dl=el("dl");row(dl,"價格",p,"price");
      const cb=el("input",{type:"checkbox"});cb.checked=selected.has(p.id);cb.setAttribute("aria-label","選取 "+f(p.name));
      cb.onchange=()=>{if(cb.checked)selected.add(p.id);else selected.delete(p.id);updateBar()};
      list.append(el("article",{className:"item withsel"},el("label",{className:"sel"},cb),
        el("div",{className:"grow"},lnk("",()=>go("detail",p.id),"t",el("h2",{textContent:f(p.name)}),catLine(p),dl))))});
    updateBar()}
  search.oninput=()=>{q=search.value;refresh()};
  fs.onchange=()=>{fStatus=fs.value;refresh()};
  fc.onchange=()=>{fConf=fc.value;refresh()};
  clear.onclick=()=>{filter="全部";q="";fStatus="";fConf="";search.value="";fs.value="";fc.value="";refresh()};
  allCb.onchange=()=>{if(allCb.checked)visible.forEach(p=>selected.add(p.id));else visible.forEach(p=>selected.delete(p.id));refresh()};
  apply.onclick=()=>{const s2=bst.value;let n=0,same=0;
    [...selected].forEach(id=>{const old=all().find(x=>x.id===id);if(!old)return;
      if((STATUSES.includes(old.status)?old.status:"")===s2){same++;return}
      updateProduct(id,{status:s2});addLog(id,old.name,[{f:"供應狀態",from:dispVal("status",old.status),to:s2}],true);n++});
    refresh();bmsg.textContent="已將 "+n+" 項設為「"+s2+"」"+(same?"（另有 "+same+" 項本來就是這個狀態，未變更）":"")+"。"};
  exp.onclick=()=>{const items=visible.filter(p=>selected.has(p.id));if(items.length)openExport(items)};
  refresh();
  return [el("h1",{textContent:"商品記錄"}),bar,filt,batch,bmsg,list];
}
function detailView(id){
  const p=all().find(x=>x.id===id);
  if(!p)return [el("p",{textContent:"找不到這個商品。"}),lnk("← 回商品清單",()=>go("list"))];
  const dl=el("dl");row(dl,"價格",p,"price");row(dl,"說明",p,"description");row(dl,"成分",p,"ingredients");
  return [el("p",{},lnk("← 回商品清單",()=>go("list"))),
    el("article",{className:"item"},el("h2",{textContent:f(p.name)}),catLine(p),dl),
    el("p",{},el("button",{type:"button",textContent:"修改商品",onclick:()=>openModal(p)})),
    logView(p.id)];
}
function newView(p){
  const name=el("input",{id:"n"});
  const cat=el("select",{id:"c"},el("option",{value:"",textContent:"未分類"}),...CATS.map(c=>el("option",{value:c,textContent:c})));
  const st=el("select",{id:"st"},el("option",{value:"",textContent:"待確認"}),...STATUSES.map(c=>el("option",{value:c,textContent:c})));
  const price=el("input",{id:"p"}),desc=el("textarea",{id:"d",rows:3}),ing=el("textarea",{id:"i",rows:3});
  if(p){name.value=p.name||"";cat.value=p.cat||"";st.value=p.status||"";price.value=p.price||"";desc.value=p.description||"";ing.value=p.ingredients||""}
  const lab=(t,x)=>el("label",{},t,x);
  const msg=el("p",{className:"msg",role:"alert"});
  const warn=el("div",{className:"warn",hidden:true,role:"alert"});let warned=false;
  const saveBtn=el("button",{type:"button",textContent:"儲存商品",onclick:()=>save()});
  name.addEventListener("input",()=>{if(warned){warned=false;warn.hidden=true;saveBtn.textContent="儲存商品"}});
  function showWarn(d){warn.replaceChildren(el("strong",{textContent:"已有相同或相似的商品，請確認是否重複："}),
      el("ul",{},...d.slice(0,5).map(x=>el("li",{textContent:x.kind+"：「"+f(x.p.name)+"」（"+(STATUSES.includes(x.p.status)?x.p.status:"供應狀態待確認")+"）"}))),
      el("span",{textContent:"如果確定是不同的商品，請再按一次「仍要新增」。"}));
    warn.hidden=false;warned=true;saveBtn.textContent="仍要新增";warn.scrollIntoView({block:"nearest"})}
  const inputs={price:price,description:desc,ingredients:ing},cbs={};
  function fld(label,k,input){const cb=el("input",{type:"checkbox"});cbs[k]=cb;const txt=el("span",{});
    let wasBlank=!hasVal(input.value);
    function sync(){const blank=!hasVal(input.value);
      if(blank){cb.checked=true;cb.disabled=true;txt.textContent="未填寫，一定是待確認"}
      else{cb.disabled=false;if(wasBlank)cb.checked=true;txt.textContent="這項資料尚待確認（確認後請取消勾選）"}
      wasBlank=blank}
    cb.checked=p?isPending(p,k):true;sync();if(p&&hasVal(input.value))cb.checked=isPending(p,k);
    input.addEventListener("input",sync);
    return el("div",{className:"fld"},lab(label+"（不確定就留空）",input),el("label",{className:"chk"},cb,txt))}
  const form=el("form",{},lab("商品名稱（必填）",name),warn,lab("分類",cat),lab("供應狀態",st),fld("價格","price",price),fld("說明","description",desc),fld("成分","ingredients",ing),
    saveBtn,msg,
    el("p",{className:"note",textContent:"商品只會存在這台裝置的這個瀏覽器，換裝置或清除瀏覽資料就看不到。"}));
  form.onsubmit=e=>{e.preventDefault();save()};
  function save(){if(!name.value.trim()){msg.textContent="請輸入商品名稱。";return}
    msg.textContent="";
    if(!p&&!warned){const d=findSimilar(name.value);if(d.length){showWarn(d);return}}
    const pending={};PFIELDS.forEach(k=>{pending[k]=!hasVal(inputs[k].value)||cbs[k].checked});
    const data={name:name.value.trim(),cat:cat.value,status:st.value,price:price.value,description:desc.value,ingredients:ing.value,pending:pending};
    if(p){const old=all().find(x=>x.id===p.id)||p;const ch=diffProduct(old,Object.assign({},old,data));updateProduct(p.id,data);if(ch.length)addLog(p.id,data.name,ch,false)}else{const a=loadAdded();a.push(Object.assign({id:"u"+Date.now()},data));saveAdded(a)}
    closeModal();render();}
  return [el("p",{},lnk("← 回商品清單",()=>go("list"))),el("h1",{textContent:"新增商品"}),form];
}
let modal=null;
function closeModal(){if(modal){modal.remove();modal=null}}
function openModal(p){closeModal();const form=newView(p)[2];const title=p?"修改商品":"新增商品";
  const box=el("div",{className:"box",role:"dialog"},el("h2",{textContent:title}),form,el("button",{type:"button",className:"chip",textContent:"取消",onclick:closeModal}));
  box.setAttribute("aria-modal","true");box.setAttribute("aria-label",title);
  modal=el("div",{className:"overlay"},box);
  modal.onclick=e=>{if(e.target===modal)closeModal()};
  document.body.append(modal);form.querySelector("#n").focus()}
function openExport(items){closeModal();const csv=buildCsv(items);
  const ta=el("textarea",{readOnly:true,rows:8,value:csv,id:"csvtext"});ta.setAttribute("aria-label","匯出內容");
  const d=new Date(),ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  const dl=el("button",{type:"button",id:"dlcsv",textContent:"下載 CSV 檔",onclick:()=>{const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=el("a",{href:url,download:"商品資料-"+ymd+".csv"});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}});
  const box=el("div",{className:"box",role:"dialog"},el("h2",{textContent:"匯出所選商品（"+items.length+" 項）"}),dl,
    el("p",{className:"note",textContent:"如果下載沒有反應，可以複製下面的內容，貼到記事本並存成 .csv 檔。"}),ta,
    el("button",{type:"button",className:"chip",textContent:"關閉",onclick:closeModal}));
  box.setAttribute("aria-modal","true");box.setAttribute("aria-label","匯出所選商品");
  modal=el("div",{className:"overlay"},box);modal.onclick=e=>{if(e.target===modal)closeModal()};
  document.body.append(modal);dl.focus()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function render(){let v;if(view.n==="detail")v=detailView(view.id);else if(view.n==="new")v=newView();else v=listView();root.replaceChildren(...v)}

// ===== 密碼：這裡存的是密碼的 SHA-256 雜湊值，不是密碼本身 =====
const PASSWORD_HASH="96c54bc58373b9874c431fd45e47dd07af415db8fc234982ef440c8316d4ebaf";
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function unlockUI(){document.getElementById("gate").hidden=true;root.hidden=false;render()}
async function tryUnlock(){const m=document.getElementById("gate-msg");m.textContent="";
  if(!window.crypto||!crypto.subtle){m.textContent="此網址無法驗證密碼，請改用 https:// 或 http://localhost 開啟。";return}
  const h=await sha256(document.getElementById("pw").value);
  if(h===PASSWORD_HASH){try{sessionStorage.setItem("unlocked","1")}catch(e){}unlockUI()}else m.textContent="密碼錯誤。"}
document.getElementById("unlock").onclick=tryUnlock;
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock()});
try{if(sessionStorage.getItem("unlocked")==="1")unlockUI()}catch(e){}

</script></body></html>
